name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish x64
        run: dotnet publish src/MermaYT.WinUi/MermaYT.WinUi.csproj -c Release -r win-x64 --self-contained /p:Platform=x64 /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:PublishSingleFile=true

      - name: Zip
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $src = 'src/MermaYT.WinUi/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish'
          Compress-Archive -Path "$src\*" -DestinationPath "MermaYT-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MermaYT-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
